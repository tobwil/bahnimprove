name: Offene Daten sichern

# Jeden Montag die verdichteten Tageswerte und den Wochenbericht von der Live-Seite ins Repo holen.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/export-open-data.ts
        env:
          SITE: https://sharemytrain.de
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-data
          git diff --cached --quiet || git commit -m "Offene Daten aktualisiert"
          git push
